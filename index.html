<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Fire Breath</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0907;
      --warm: #d4924a;
      --warm-bright: #f0b870;
      --warm-dim: #b07d3a;
      --text-muted: #8a6030;
      --line: rgba(180,120,50,0.12);
      --line-hover: rgba(180,120,50,0.3);
      --line-active: rgba(180,120,50,0.45);
      --fill-hover: rgba(180,120,50,0.07);
      --fill-active: rgba(180,120,50,0.1);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: radial-gradient(120% 90% at 50% 38%, #0d0a08 0%, var(--bg) 55%, #070503 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--warm);
      overflow: hidden;
      overscroll-behavior: none;   /* no pull-to-refresh / rubber-banding when installed */
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; }
    button:focus-visible, .preset-card:focus-visible {
      outline: 1px solid rgba(240,184,112,0.55);
      outline-offset: 3px;
    }

    /* ---- SCREENS ---- */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transition: opacity 0.9s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ---- SETUP ---- */
    #screen-setup {
      gap: 24px;
      padding: 24px 20px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .app-title {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 400;
      letter-spacing: 0.45em;
      padding-left: 0.45em; /* recentre: letter-spacing adds a trailing gap */
      color: var(--warm-bright);
      opacity: 0.78;
      margin-bottom: 4px;
      text-shadow: 0 0 28px rgba(240,184,112,0.22);
    }

    .section-label {
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
      user-select: none;
    }

    /* Wrappers own the width so the grids inside resolve against the viewport
       rather than their own content, which would overflow a narrow phone. */
    .section {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 4 presets in a 2×2 and 6 durations in a 3×2 — flex wrapping strands
       "Custom" and "free" alone on a full-width row at tablet sizes. */
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: min(520px, 100%);
    }

    .preset-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
      text-align: center;
      user-select: none;
    }
    .preset-card.active { background: var(--fill-active); border-color: var(--line-active); }
    @media (hover: hover) {
      .preset-card:hover { background: var(--fill-hover); border-color: var(--line-hover); transform: translateY(-2px); }
      .preset-card.active:hover { background: var(--fill-active); }
    }

    .preset-name { font-size: clamp(0.88rem, 3vw, 1rem); color: var(--warm-bright); margin-bottom: 4px; }
    .preset-timing { font-size: clamp(0.7rem, 2.2vw, 0.78rem); font-family: monospace; letter-spacing: 0.08em; color: var(--warm-dim); white-space: nowrap; }
    .preset-desc { font-size: clamp(0.65rem, 2vw, 0.72rem); color: var(--text-muted); margin-top: 6px; font-style: italic; }

    .custom-row {
      display: flex;
      gap: 14px;
      align-items: flex-end;
      justify-content: center;
    }
    .custom-row.collapsed { display: none; }

    .phase-field { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .phase-field label { font-size: clamp(0.58rem, 2vw, 0.65rem); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
    .phase-field input {
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(180,120,50,0.2);
      border-radius: 8px;
      color: var(--warm-bright);
      font-size: 1.5rem;
      text-align: center;
      font-family: Georgia, serif;
    }
    .phase-field input:focus { outline: none; border-color: rgba(180,120,50,0.5); }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    .duration-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(520px, 100%);
    }

    .dur-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: clamp(0.78rem, 2.5vw, 0.88rem);
      color: var(--warm-dim);
      font-family: Georgia, serif;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      min-height: 44px;
    }
    .dur-btn:hover { background: var(--fill-hover); color: var(--warm); }
    .dur-btn.active { background: var(--fill-active); border-color: var(--line-active); color: var(--warm-bright); }

    .begin-btn {
      background: transparent;
      border: 1px solid rgba(180,120,50,0.35);
      border-radius: 32px;
      padding: 16px 56px;
      color: var(--warm);
      font-size: clamp(0.9rem, 3vw, 1rem);
      letter-spacing: 0.28em;
      padding-left: calc(56px + 0.28em);
      cursor: pointer;
      font-family: Georgia, serif;
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
      margin-top: 4px;
      min-height: 56px;
    }
    .begin-btn:hover {
      background: var(--fill-active);
      border-color: rgba(180,120,50,0.65);
      box-shadow: 0 0 28px rgba(212,146,74,0.14);
    }
    .begin-btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; }

    /* ---- DESKTOP OVERRIDES ---- */
    @media (min-width: 600px) {
      #screen-setup { padding: 0; gap: 28px; }
    }
    /* Wide enough for one row each — still a grid, so nothing is ever stranded */
    @media (min-width: 780px) {
      .section      { max-width: 760px; }
      .presets-grid { grid-template-columns: repeat(4, 1fr); width: 100%; }
      .duration-row { grid-template-columns: repeat(6, 1fr); width: min(720px, 100%); }
    }

    /* ---- SESSION ---- */
    #screen-session { padding: 0; }

    #c {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .session-ui {
      position: absolute;
      bottom: max(36px, env(safe-area-inset-bottom));
      display: flex;
      gap: 40px;
      align-items: center;
      z-index: 10;
    }

    .ctrl {
      background: none;
      border: none;
      color: rgba(180,120,50,0.26);
      cursor: pointer;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: lowercase;
      font-family: Georgia, serif;
      padding: 14px 22px;
      transition: color 0.35s;
      min-height: 48px;
    }
    .ctrl:hover { color: rgba(180,120,50,0.65); }

    .sound-toggle {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      right: max(26px, env(safe-area-inset-right));
      background: none;
      border: none;
      color: rgba(180,120,50,0.2);
      cursor: pointer;
      font-size: clamp(0.62rem, 2vw, 0.7rem);
      letter-spacing: 0.15em;
      font-family: Georgia, serif;
      padding: 12px;
      transition: color 0.3s;
    }
    .sound-toggle:hover { color: rgba(180,120,50,0.5); }

    /* ---- COMPLETE ---- */
    #screen-complete { gap: 20px; }
    .done-msg {
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      color: var(--warm-bright);
      opacity: 0.55;
      text-shadow: 0 0 22px rgba(240,184,112,0.25);
    }
    .again-btn {
      background: transparent;
      border: 1px solid rgba(180,120,50,0.18);
      border-radius: 20px;
      padding: 11px 28px;
      min-height: 44px;
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      cursor: pointer;
      font-family: Georgia, serif;
      transition: border-color 0.35s, color 0.35s;
    }
    .again-btn:hover { border-color: rgba(180,120,50,0.4); color: var(--warm); }
  </style>
</head>
<body>

<!-- SETUP -->
<div class="screen" id="screen-setup">
  <h1 class="app-title">fire breath</h1>

  <div class="section">
    <div class="section-label">pattern</div>
    <div class="presets-grid" id="presets-grid"></div>
  </div>

  <div class="custom-row collapsed" id="custom-row">
    <div class="phase-field"><label>Inhale</label><input type="number" inputmode="numeric" id="ci" min="0" max="60" value="4"></div>
    <div class="phase-field"><label>Hold</label><input type="number" inputmode="numeric" id="ch1" min="0" max="60" value="4"></div>
    <div class="phase-field"><label>Exhale</label><input type="number" inputmode="numeric" id="ce" min="0" max="60" value="4"></div>
    <div class="phase-field"><label>Hold</label><input type="number" inputmode="numeric" id="ch2" min="0" max="60" value="4"></div>
  </div>

  <div class="section">
    <div class="section-label">duration</div>
    <div class="duration-row" id="duration-row"></div>
  </div>

  <button class="begin-btn" id="begin-btn">begin</button>
</div>

<!-- SESSION -->
<div class="screen hidden" id="screen-session">
  <canvas id="c"></canvas>
  <div class="session-ui">
    <button class="ctrl" id="pause-btn">pause</button>
    <button class="ctrl" id="stop-btn">stop</button>
  </div>
  <button class="sound-toggle" id="sound-btn">sound off</button>
</div>

<!-- COMPLETE -->
<div class="screen hidden" id="screen-complete">
  <p class="done-msg">well done</p>
  <button class="again-btn" id="again-btn">again</button>
</div>

<script>
'use strict';

// ─── PRESETS ───────────────────────────────────────────────────────────────
const PRESETS = [
  { id: 'box',      name: 'Box Breathing',     p: [4,4,4,4], desc: 'Focus & composure' },
  { id: 'relaxing', name: 'Relaxing Breath',   p: [4,7,8,0], desc: 'Calm anxiety, aid sleep' },
  { id: 'energize', name: 'Energizing Breath', p: [6,0,6,0], desc: 'Gentle alertness' },
  { id: 'custom',   name: 'Custom',            p: [4,4,4,4], desc: 'Your own rhythm' },
];

const DUR_TARGETS = [60, 120, 300, 600, 1800];
const DUR_LABELS  = ['~1 min', '~2 min', '~5 min', '~10 min', '~30 min'];

// ─── STATE ─────────────────────────────────────────────────────────────────
let selPreset  = PRESETS[0];
let selDurIdx  = 0;             // index into DUR_TARGETS, or null = free
let pattern    = [4,4,4,4];     // current [inhale,hold,exhale,hold]
let soundOn    = false;

// ─── ENGINE ────────────────────────────────────────────────────────────────
class BreathEngine {
  constructor(pat, totalSec) {
    const names = ['inhale','holdTop','exhale','holdBottom'];
    this.phases = pat
      .map((d,i) => ({ name: names[i], durMs: d * 1000 }))
      .filter(p => p.durMs > 0);
    this.cycleLenMs = this.phases.reduce((a, p) => a + p.durMs, 0);
    this.totalMs    = totalSec ? totalSec * 1000 : null;
    this.startTs    = null;
    this.pausedTs   = null;
    this.pausedMs   = 0;
    this.done       = false;
    this.onDone     = null;
  }

  start()  { this.startTs = performance.now(); }
  pause()  { if (!this.pausedTs) this.pausedTs = performance.now(); }
  resume() {
    if (this.pausedTs) { this.pausedMs += performance.now() - this.pausedTs; this.pausedTs = null; }
  }
  stop()   { this.done = true; }
  get paused() { return this.pausedTs !== null; }

  elapsedMs() {
    if (!this.startTs) return 0;
    const ref = this.pausedTs ?? performance.now();
    return ref - this.startTs - this.pausedMs;
  }

  getState() {
    if (!this.phases.length) return { flameT: 0, phaseT: 0, phase: 'inhale', sessionProg: 0 };

    const elapsed = this.elapsedMs();
    const sessionProg = this.totalMs ? Math.min(1, elapsed / this.totalMs) : 0;

    if (this.totalMs && !this.done && elapsed >= this.totalMs) {
      this.done = true;
      if (this.onDone) setTimeout(this.onDone, 0);
    }

    if (this.cycleLenMs === 0) return { flameT: 0, phaseT: 0, phase: 'inhale', sessionProg };

    const pos = elapsed % this.cycleLenMs;
    let acc = 0;
    for (const p of this.phases) {
      if (pos < acc + p.durMs) {
        const t = (pos - acc) / p.durMs;
        return { flameT: phaseFlameT(p.name, t), phaseT: t, phase: p.name, sessionProg };
      }
      acc += p.durMs;
    }
    return { flameT: 0, phaseT: 0, phase: 'inhale', sessionProg };
  }
}

function phaseFlameT(name, t) {
  switch (name) {
    case 'inhale':      return t;
    case 'holdTop':     return 1;
    case 'exhale':      return 1 - t;
    case 'holdBottom':  return 0;
    default:            return 0;
  }
}

// Maps phase + linear t (0→1) to (x, y) in virtual-pixel coords on the box perimeter.
// L/T/R/B are the box edges. Motion: inhale up-left, holdTop right-top, exhale down-right, holdBottom left-bottom.
function indicatorPosition(phase, t, L, T, R, B) {
  switch (phase) {
    case 'inhale':      return [L, B - t * (B - T)];
    case 'holdTop':     return [L + t * (R - L), T];
    case 'exhale':      return [R, T + t * (B - T)];
    case 'holdBottom':  return [R - t * (R - L), B];
    default:            return [L, B];
  }
}

// ─── PIXEL ART RENDERER ───────────────────────────────────────────────────
// Each "virtual pixel" renders as P×P screen pixels for a chunky pixel-art look.
let P = 5;
function computeP() {
  // Use the longer dimension so portrait phones get a larger pixel size
  return Math.max(3, Math.min(8, Math.round(Math.max(canvas.width, canvas.height) / 140)));
}

// Candle positions in virtual-pixel units (xOff from grid center).
// Spacing = 10 vp; max holder half-width r=4 → 2 vp gap between adjacent holders.
// drip: which outer edge carries a wax run (-1 left, 1 right, 0 none).
const CANDLES = [
  { xOff: -20, maxWax: 26, flicker: 0.07, holder: 'saucer',      highlight: 7, drip: -1 },
  { xOff: -10, maxWax: 20, flicker: 0.13, holder: 'cup',         highlight: 4, drip:  1 },
  { xOff:   0, maxWax: 31, flicker: 0.00, holder: 'candlestick', highlight: 9, drip:  0 },
  { xOff:  10, maxWax: 22, flicker: 0.09, holder: 'bowl',        highlight: 3, drip:  1 },
  { xOff:  20, maxWax: 17, flicker: 0.05, holder: 'cylinder',    highlight: 6, drip: -1 },
];
const WAX_HW       = 2;   // wax half-width in virtual pixels (total 5 vp wide)
const FLAME_MIN_PX = 3;
const FLAME_MAX_PX = 24;  // flame outreaches the wax — it is the thing being watched

const flickSeeds = CANDLES.map(() => Math.random() * 1000);

// Warm limited palette.
// The whole scene obeys one rule: the flame is the only light source, so
// everything below it is graded by how much of that light it can catch.
const PAL = {
  // Flame ramp, hottest → coolest
  flameCore: '#fff4cf',
  flameHot:  '#ffc74a',
  flameMid:  '#ff9022',
  flameDeep: '#f2620e',
  flameEdge: '#c03604',
  wick:      '#191009',
  ember:     '#a04a14',
  // Molten rim of the wax pool — brightens as the flame grows
  rimHot:    '#fff3cc',
  rimWarm:   '#efd9a0',
  rimCool:   '#c3aa71',
};

// Wax tones, band 0 nearest the flame falling to band 3 in shadow.
// out = outline column · lit = highlight face · face = body · shade = turning edge
const WAX_BANDS = [
  { out: '#8a6529', lit: '#fff0c4', face: '#eaca80', shade: '#bb9046' },
  { out: '#6d4b1e', lit: '#e9cd90', face: '#cfa759', shade: '#98702f' },
  { out: '#523818', lit: '#c19c60', face: '#a37f3e', shade: '#74521f' },
  { out: '#38250f', lit: '#8e6f3d', face: '#77592c', shade: '#523815' },
];

// Holder tones, picked by how much flame there is to light them. `side` runs
// top-to-bottom within the holder so it turns under itself instead of reading
// as a flat dark lump.
const HOLD_BANDS = [
  { spec: '#d29a4c', top: '#9c6d36', side: ['#6d4629', '#553321', '#3a2216'], edge: '#2e1a12', dark: '#180d07' },
  { spec: '#a87740', top: '#7d5529', side: ['#553620', '#42281a', '#2c1a11'], edge: '#24140d', dark: '#130a05' },
  { spec: '#805c2e', top: '#603f20', side: ['#412819', '#331e14', '#20130c'], edge: '#1a0d08', dark: '#0f0704' },
];

// ─── CANVAS ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  P = computeP();
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let engine   = null;
let rafId    = null;
let dieout   = false;
let dieoutTs = 0;
let smokeParticles = [];
const DIEOUT_DUR = 3000; // ms for candles to extinguish + smoke to clear

function renderLoop() {
  if (!engine) return;
  drawFrame();
  rafId = requestAnimationFrame(renderLoop);
}

function drawFrame() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;

  const state   = engine.getState();
  const now     = performance.now() / 1000;
  let   flameT  = state.flameT;
  const waxProg = state.sessionProg;

  let dieoutFactor      = 1;
  let flameDieoutFactor = 1;
  let dieoutElapsed     = 0;
  if (dieout) {
    dieoutElapsed      = performance.now() - dieoutTs;
    dieoutFactor       = Math.max(0, 1 - dieoutElapsed / DIEOUT_DUR);
    flameDieoutFactor  = Math.max(0, 1 - dieoutElapsed / (DIEOUT_DUR * 0.3));
    flameT            *= flameDieoutFactor;
  }

  // Virtual-pixel grid centre (snapped to whole vp so pixels are stable)
  const cx_vp    = Math.round(W / 2 / P);
  const baseY_vp = Math.round(H * 0.65 / P);

  // Box bounds in virtual-pixel coords (generous padding around the candle cluster)
  const boxL = cx_vp - 27;
  const boxR = cx_vp + 27;
  const boxT = baseY_vp - 60;
  const boxB = baseY_vp + 11;

  // Smooth ambient glow drawn at full resolution underneath the pixel art
  const glowA  = 0.04 + flameT * 0.09;
  const glowCY = (baseY_vp - 14) * P;
  const glow   = ctx.createRadialGradient(W / 2, glowCY, 0, W / 2, glowCY, Math.min(W, H) * 0.52);
  glow.addColorStop(0,   `rgba(210,115,25,${glowA})`);
  glow.addColorStop(0.5, `rgba(150,70,10,${glowA * 0.4})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Floor light pool: flattened radial ellipse beneath the holders grounds the cluster
  const poolY = (baseY_vp + 8) * P;
  ctx.save();
  ctx.translate(W / 2, poolY);
  ctx.scale(1, 0.26);
  const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, 34 * P);
  pool.addColorStop(0, `rgba(220,130,35,${0.04 + flameT * 0.06})`);
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool;
  ctx.fillRect(-34 * P, -34 * P, 68 * P, 68 * P);
  ctx.restore();

  // Subtle 1-vp rectangular outline around the candle cluster
  ctx.fillStyle = `rgba(180,110,40,${0.22 * dieoutFactor})`;
  ctx.fillRect(boxL * P, boxT * P, (boxR - boxL + 1) * P, P);           // top edge
  ctx.fillRect(boxL * P, boxB * P, (boxR - boxL + 1) * P, P);           // bottom edge
  ctx.fillRect(boxL * P, boxT * P, P, (boxB - boxT + 1) * P);           // left edge
  ctx.fillRect(boxR * P, boxT * P, P, (boxB - boxT + 1) * P);           // right edge

  CANDLES.forEach((def, i) => {
    const cx     = cx_vp + def.xOff;
    const waxH   = Math.max(0, Math.floor(def.maxWax * (1 - waxProg)));
    const waxTop = baseY_vp - waxH;

    pixDrawHolder(cx, baseY_vp, def.holder, flameT);
    if (waxH > 0) pixDrawWax(cx, waxTop, waxH, def, flameT);

    // Per-candle flicker: multi-sine, amplitude from def.flicker (centre candle stays steady)
    const flick = (Math.sin(now * 6.7  + flickSeeds[i])       * 0.5
                 + Math.sin(now * 11.3 + flickSeeds[i] * 1.7) * 0.25
                 + Math.sin(now * 3.1  + flickSeeds[i] * 0.8) * 0.25)
                 * (0.035 + def.flicker * 0.55);

    let fT = flameT;
    if (state.phase === 'holdTop' || state.phase === 'holdBottom') {
      fT = Math.max(0, Math.min(1, fT + flick));
    }

    const fH = Math.max(0, Math.round((FLAME_MIN_PX + (FLAME_MAX_PX - FLAME_MIN_PX) * fT) * flameDieoutFactor));
    pixDrawWick(cx, waxTop, fH);
    // baseY one row into the wick so the flame wraps its tip instead of floating
    pixDrawFlame(cx, waxTop - 1, fH, now, flickSeeds[i], 0.8 + def.flicker * 8);
  });

  // Smoke particles
  if (dieout) {
    const smokePhase = dieoutElapsed / DIEOUT_DUR;
    const spawning   = smokePhase > 0.08 && smokePhase < 0.72;
    if (spawning) {
      CANDLES.forEach((def) => {
        const cx    = cx_vp + def.xOff;
        const waxH  = Math.max(0, Math.floor(def.maxWax * (1 - waxProg)));
        const wickY = baseY_vp - waxH - 2;
        if (Math.random() < 0.5) spawnSmoke(cx, wickY);
      });
    }
    drawSmoke(now);
  }

  // Perimeter indicator: freeze at bottom-left on dieout, otherwise trace normally
  if (!engine.paused) {
    let dotX, dotY;
    if (dieout) {
      dotX = boxL - 1;
      dotY = boxB;
    } else {
      const [ix, iy] = indicatorPosition(state.phase, state.phaseT, boxL, boxT, boxR, boxB);
      dotX = ix - 1;
      dotY = iy - 1;
      if (state.phase === 'exhale')      dotX = boxR;
      if (state.phase === 'holdBottom')  dotY = boxB;
    }
    ctx.fillStyle = `rgba(230,155,55,${0.85 * dieoutFactor})`;
    ctx.fillRect(Math.round(dotX * P), Math.round(dotY * P), 2 * P, 2 * P);
  }

  if (engine && engine.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ── SMOKE PARTICLES ─────────────────────────────────────────────────────────

function spawnSmoke(cx, wickY) {
  smokeParticles.push({
    x:            cx + (Math.random() - 0.5) * 2,
    y:            wickY,
    vx:           (Math.random() - 0.5) * 0.02,
    vy:           -(0.1 + Math.random() * 0.1),
    baseOpacity:  0.4 + Math.random() * 0.35,
    shimmerFreq:  7 + Math.random() * 9,
    shimmerPhase: Math.random() * Math.PI * 2,
    driftFreq:    1.5 + Math.random() * 2,
    driftPhase:   Math.random() * Math.PI * 2,
    age:          0,
    maxAge:       240 + Math.floor(Math.random() * 100),
    size:         Math.random() < 0.3 ? 2 : 1,
  });
}

function drawSmoke(now) {
  smokeParticles = smokeParticles.filter(p => p.age < p.maxAge);
  for (const p of smokeParticles) {
    p.x  += p.vx + Math.sin(now * p.driftFreq + p.driftPhase) * 0.02;
    p.y  += p.vy;
    p.age++;
    const lifeFrac = p.age / p.maxAge;
    const shimmer  = 0.5 + 0.5 * Math.sin(now * p.shimmerFreq + p.shimmerPhase);
    const opacity  = p.baseOpacity * (1 - lifeFrac * lifeFrac) * (0.55 + 0.45 * shimmer);
    if (opacity < 0.01) continue;
    const warmth = Math.max(0, 1 - lifeFrac * 2.5);
    ctx.fillStyle = `rgba(${Math.round(195+warmth*22)},${Math.round(188+warmth*10)},180,${opacity.toFixed(3)})`;
    ctx.fillRect(Math.round(p.x*P - (p.size*P)/2), Math.round(p.y*P), p.size*P, P);
  }
}

// ─── PIXEL ART DRAWING HELPERS ────────────────────────────────────────────
function pxRow(x, y, w, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * P, y * P, w * P, P);
}
function pxBlock(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * P, y * P, w * P, h * P);
}
function px(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * P, y * P, P, P);
}

// ── FLAME ─────────────────────────────────────────────────────────────────
const FLAME_RAMP = [PAL.flameCore, PAL.flameHot, PAL.flameMid, PAL.flameDeep, PAL.flameEdge];

// Silhouette: a teardrop. Zero at the tip, widest just below the middle, then
// necking — not tapering to a point — where it meets the wick, so the flame
// reads as attached to the candle rather than floating above it.
function flameProfile(ft) {
  const PEAK = 0.72, NECK = 0.44;
  if (ft <= PEAK) return Math.sin((ft / PEAK) * (Math.PI / 2));
  return 1 - (1 - NECK) * Math.pow((ft - PEAK) / (1 - PEAK), 1.45);
}

// Vertical heat: the tip is cool and smoky, the body burns hottest just below
// the middle, and it cools again slightly at the neck. Combined with distance
// from the axis this gives a heat field — quantising it puts the bright core
// where a real flame keeps it (a blob low in the body) instead of running it
// up the full height as a hard spine.
function flameHeat(ft) {
  const PEAK = 0.70;
  if (ft < PEAK) return 0.24 + 0.76 * Math.pow(ft / PEAK, 1.35);
  return 1 - 0.34 * Math.pow((ft - PEAK) / (1 - PEAK), 1.2);
}

function pixDrawFlame(cx, baseY, h, now, seed, swayAmp) {
  if (h < 1) return;

  // Soft luminous halo behind the pixels; the wax below catches the spill
  const hf = h / FLAME_MAX_PX;
  const gx = (cx + 0.5) * P;
  const gy = (baseY - h * 0.55) * P;
  const gr = Math.max(1, h * P * 1.6);
  const halo = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
  halo.addColorStop(0,    `rgba(255,160,50,${0.06 + 0.09 * hf})`);
  halo.addColorStop(0.45, `rgba(230,110,25,${0.03 + 0.04 * hf})`);
  halo.addColorStop(1,    'rgba(255,150,40,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);

  // Below ~5vp there is no room for a silhouette; a single bright column
  // reads as a guttering flame, where a 3-wide one reads as a plus sign.
  // 0.17 keeps a full flame 9vp wide against the 10vp candle spacing; any wider
  // and neighbouring flames touch, and the five candles read as one mass.
  const maxHW = h < 5 ? 0 : Math.max(1, Math.round(h * 0.17));
  // Slow two-sine lean; amplitude stays around a pixel so the flame breathes
  // rather than thrashes — this is a calming app, not a campfire.
  const lean = (Math.sin(now * 1.3 + seed) * 0.62 + Math.sin(now * 3.1 + seed * 2.3) * 0.38)
             * swayAmp * Math.min(1, hf * 1.3);

  for (let row = 0; row < h; row++) {
    const ft = row / Math.max(h - 1, 1); // 0 = tip, 1 = root
    const hw = Math.max(0, Math.round(maxHW * flameProfile(ft)));

    // Shimmer each edge on its own phase — a symmetric silhouette reads as an
    // almond; independent edges keep it alive and organic.
    const shim = hw > 1 && ft > 0.12 && ft < 0.82;
    const hwL = shim && Math.sin(now * 8.3 + seed * 2.1 + row * 1.7) > 0.62 ? hw - 1 : hw;
    const hwR = shim && Math.sin(now * 7.1 + seed * 3.3 + row * 1.4) > 0.62 ? hw - 1 : hw;

    const bend = Math.round(lean * Math.pow(1 - ft, 2.1)); // tip licks, root stays put
    const rcx  = cx + bend;
    const vy   = baseY - h + row;
    const vh   = flameHeat(ft);

    for (let dx = -hwL; dx <= hwR; dx++) {
      const dr   = hw > 0 ? Math.abs(dx) / (hw + 0.01) : 0;
      const heat = (1 - Math.pow(dr, 1.2)) * vh;

      // Core threshold sits low enough that the bright centre holds a steady
      // width over a long vertical run — raise it and the core pinches to a
      // single column with one bulge, which reads as a cross, not a flame.
      let idx = heat > 0.72 ? 0 : heat > 0.56 ? 1 : heat > 0.38 ? 2 : heat > 0.19 ? 3 : 4;
      // Small flames never reach white — a guttering wick glows orange, not hot
      if (h < 10) idx = Math.max(idx, 1);
      if (h < 6)  idx = Math.max(idx, 2);

      px(rcx + dx, vy, FLAME_RAMP[idx]);
    }
  }
}

// ── WAX ───────────────────────────────────────────────────────────────────
// 5-vp cylinder shaded by distance from the flame: bright at the molten rim,
// sinking into shadow further down. The reach of that light scales with the
// flame, so the candles visibly brighten as you inhale and dim as you exhale —
// the wax carries the breath as much as the flame does.
// Ordered dither so a band change reads as a soft gradient rather than a hard
// horizontal seam banding the candle into segments.
const BAYER2 = [[0.20, 0.70], [0.95, 0.45]];
function waxBandAt(depth, step, col) {
  const f = depth / step;
  const b = Math.floor(f);
  // Confine the checker to the last third of each band so the transition is
  // stippled but the body of the band stays a clean, solid tone.
  const i = (f - b) > 0.62 + BAYER2[col & 1][depth & 1] * 0.36 ? b + 1 : b;
  return WAX_BANDS[Math.max(0, Math.min(WAX_BANDS.length - 1, i))];
}

function pixDrawWax(cx, waxTop, waxH, def, flameT) {
  const L = cx - WAX_HW;
  const R = cx + WAX_HW;
  const step = Math.max(2.6, (4.5 + flameT * 11) / 1.7);

  for (let d = 0; d < waxH; d++) {
    const y = waxTop + d;
    px(L,      y, waxBandAt(d, step, L).out);
    px(cx - 1, y, d < def.highlight ? waxBandAt(d, step, cx - 1).lit
                                    : waxBandAt(d, step, cx - 1).face);
    px(cx,     y, waxBandAt(d, step, cx).face);
    px(cx + 1, y, waxBandAt(d, step, cx + 1).shade);
    px(R,      y, waxBandAt(d, step, R).out);
  }

  // Molten pool at the top, hotter the bigger the flame
  const rim = flameT > 0.55 ? PAL.rimHot : flameT > 0.2 ? PAL.rimWarm : PAL.rimCool;
  pxRow(L, waxTop, WAX_HW * 2 + 1, rim);
  if (waxH > 3) px(cx + 1, waxTop + 1, rim);         // spills over the shade side

  // Wax run down one outer edge, ending in a bead — tinted to its own depth
  if (def.drip !== 0 && waxH > 6) {
    const dx    = def.drip < 0 ? L : R;
    const start = 2;
    const len   = Math.min(2 + (def.highlight % 4), waxH - start - 1);
    for (let k = 0; k < len; k++) px(dx, waxTop + start + k, waxBandAt(start + k, step, dx).face);
    px(dx, waxTop + start + len, waxBandAt(start + len, step, dx).lit);
  }
}

function pixDrawWick(cx, waxTop, fH) {
  pxBlock(cx, waxTop - 2, 1, 2, PAL.wick);
  if (fH >= 3) px(cx, waxTop - 2, PAL.ember); // wick tip glows while lit
}

// ── HOLDERS ───────────────────────────────────────────────────────────────
// Data-driven silhouettes: 8 rows below baseY, each [radius, face]. Faces:
// 't' lit top surface, 's' cylindrical side, 'b' bottom in shadow. Every
// base sits flat at baseY+7. Side rows get dark outer edges and a left
// highlight; where the silhouette widens, the exposed shoulder catches light.
const HOLDERS = {
  // Broad flat disc: opens to full width, gentle taper at base
  saucer:      [[2,'t'],[4,'s'],[4,'s'],[4,'s'],[4,'s'],[3,'s'],[2,'s'],[2,'b']],
  // Goblet: narrow mouth → widens → tight waist → flares to foot
  cup:         [[2,'t'],[3,'s'],[4,'s'],[2,'s'],[2,'s'],[3,'s'],[4,'s'],[4,'b']],
  // Collar → narrow stem → sudden wide foot (most dramatic silhouette)
  candlestick: [[2,'t'],[3,'s'],[2,'s'],[1,'s'],[1,'s'],[1,'s'],[4,'t'],[4,'b']],
  // Shallow wide bowl: broad lit rim, stays wide
  bowl:        [[2,'t'],[4,'t'],[4,'s'],[4,'s'],[4,'s'],[3,'s'],[2,'s'],[2,'b']],
  // Straight-sided sleeve: perfectly uniform, tallest presence
  cylinder:    [[3,'t'],[3,'s'],[3,'s'],[3,'s'],[3,'s'],[3,'s'],[3,'s'],[3,'b']],
};

function pixDrawHolder(cx, baseY, type, flameT) {
  const rows = HOLDERS[type];
  const B    = HOLD_BANDS[flameT > 0.62 ? 0 : flameT > 0.25 ? 1 : 2];
  let prevR  = 0;
  rows.forEach(([r, face], i) => {
    const y = baseY + i;
    if (face === 't') {
      pxRow(cx - r, y, 2 * r + 1, B.top);                 // upward face catches the flame
      px(cx - Math.max(0, r - 1), y, B.spec);
      if (r > 1) px(cx + r - 1, y, B.spec);
    } else if (face === 'b') {
      pxRow(cx - r, y, 2 * r + 1, B.dark);
    } else {
      pxRow(cx - r, y, 2 * r + 1, B.side[Math.min(2, i >> 1)]); // turns under itself
      px(cx - r, y, B.edge);                              // shadowed outer edges
      px(cx + r, y, B.edge);
      px(cx - r + 1, y, B.top);                           // left highlight
      if (r > prevR && i > 0) {
        px(cx + r - 1, y, B.top);                         // widening shoulder catches light
        px(cx - r + 1, y, B.spec);                        // and its lit upper lip
      }
    }
    prevR = r;
  });
}

// ─── AUDIO ─────────────────────────────────────────────────────────────────
let audioCtx = null;
let gainNode = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sr = audioCtx.sampleRate;
    const dur = 4; // seconds, looped
    const buf = audioCtx.createBuffer(1, sr * dur, sr);
    const d = buf.getChannelData(0);

    // Brown noise
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      d[i] = last * 6;
    }

    // Crackle pops
    for (let i = 0; i < d.length; i++) {
      if (Math.random() < 0.00025) {
        const len = Math.floor(Math.random() * 180 + 40);
        for (let j = 0; j < len && i+j < d.length; j++) {
          d[i+j] += (Math.random() * 2 - 1) * Math.sin(Math.PI * j / len) * 0.25;
        }
      }
    }

    // Normalize to ~0.12
    let mx = 0;
    for (let i = 0; i < d.length; i++) mx = Math.max(mx, Math.abs(d[i]));
    if (mx > 0) for (let i = 0; i < d.length; i++) d[i] = d[i] / mx * 0.12;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop   = true;

    const lpf = audioCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 700;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;

    src.connect(lpf).connect(gainNode).connect(audioCtx.destination);
    src.start();
  } catch(e) {
    console.warn('Audio unavailable:', e);
  }
}

function setSound(on) {
  initAudio();
  if (!gainNode) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  gainNode.gain.linearRampToValueAtTime(on ? 0.5 : 0, audioCtx.currentTime + 0.6);
}

// ─── SETUP UI ──────────────────────────────────────────────────────────────
function cycleLen(p) { return p.reduce((a,b)=>a+b,0); }

function buildPresets() {
  const grid = document.getElementById('presets-grid');
  grid.innerHTML = '';
  PRESETS.forEach(pr => {
    const el = document.createElement('div');
    el.className = 'preset-card' + (pr === selPreset ? ' active' : '');
    el.innerHTML = `
      <div class="preset-name">${pr.name}</div>
      <div class="preset-timing">${pr.p.join(' · ')}</div>
      <div class="preset-desc">${pr.desc}</div>
    `;
    el.addEventListener('click', () => {
      selPreset = pr;
      document.getElementById('custom-row').classList.toggle('collapsed', pr.id !== 'custom');
      if (pr.id !== 'custom') pattern = [...pr.p];
      else syncCustom();
      buildPresets();
      buildDurations();
    });
    grid.appendChild(el);
  });
}

function buildDurations() {
  const row = document.getElementById('duration-row');
  row.innerHTML = '';
  const cl = cycleLen(pattern);

  if (cl > 0) {
    DUR_LABELS.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'dur-btn' + (selDurIdx === i ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => { selDurIdx = i; buildDurations(); });
      row.appendChild(btn);
    });
  }

  const freeEl = document.createElement('button');
  freeEl.className = 'dur-btn' + (selDurIdx === null ? ' active' : '');
  freeEl.textContent = 'free';
  freeEl.addEventListener('click', () => { selDurIdx = null; buildDurations(); });
  row.appendChild(freeEl);

  document.getElementById('begin-btn').disabled = cl === 0;
}

function syncCustom() {
  pattern = [
    parseInt(document.getElementById('ci').value)  || 0,
    parseInt(document.getElementById('ch1').value) || 0,
    parseInt(document.getElementById('ce').value)  || 0,
    parseInt(document.getElementById('ch2').value) || 0,
  ];
}

['ci','ch1','ce','ch2'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { syncCustom(); buildDurations(); });
});

buildPresets();
buildDurations();

// ─── SCREEN MANAGEMENT ─────────────────────────────────────────────────────
function showScreen(name) {
  ['setup','session','complete'].forEach(n => {
    const hide = n !== name && !(name === 'complete' && n === 'session');
    document.getElementById('screen-' + n).classList.toggle('hidden', hide);
  });
}

function setSessionControlsVisible(visible) {
  document.querySelector('.session-ui').style.display = visible ? '' : 'none';
  document.getElementById('sound-btn').style.display  = visible ? '' : 'none';
}

function beginDieout(extraDelayMs) {
  dieout   = true;
  dieoutTs = performance.now();
  setSessionControlsVisible(false);
  releaseWakeLock();
  setTimeout(() => showScreen('complete'), DIEOUT_DUR + extraDelayMs);
}

// ─── WAKE LOCK ─────────────────────────────────────────────────────────────
// Keep the screen on during a session — a breathing exercise shouldn't be
// interrupted by the phone dimming and locking.
let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* low battery etc. */ }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// The lock is auto-released when the tab is backgrounded; re-acquire on return
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && engine && !engine.done) acquireWakeLock();
});

// ─── SESSION ───────────────────────────────────────────────────────────────
function startSession() {
  if (selPreset.id === 'custom') syncCustom();
  else pattern = [...selPreset.p];

  const cl = cycleLen(pattern);
  if (cl === 0) return;

  let totalSec = null;
  if (selDurIdx !== null) {
    const cycles = Math.max(1, Math.round(DUR_TARGETS[selDurIdx] / cl));
    totalSec = cycles * cl;
  }

  engine = new BreathEngine(pattern, totalSec);
  dieout = false;
  smokeParticles = [];
  setSessionControlsVisible(true);

  engine.onDone = () => beginDieout(1200);

  resizeCanvas();
  showScreen('session');
  acquireWakeLock();
  if (soundOn) setSound(true);

  engine.start();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(renderLoop);
}

document.getElementById('begin-btn').addEventListener('click', startSession);

document.getElementById('pause-btn').addEventListener('click', () => {
  if (!engine) return;
  if (engine.paused) {
    engine.resume();
    document.getElementById('pause-btn').textContent = 'pause';
    if (!rafId) rafId = requestAnimationFrame(renderLoop);
  } else {
    engine.pause();
    document.getElementById('pause-btn').textContent = 'resume';
    // keep drawing (for paused overlay)
  }
});

document.getElementById('stop-btn').addEventListener('click', () => {
  if (!engine) return;
  engine.resume(); // clear any pause so the dieout plays unobscured
  engine.stop();
  document.getElementById('pause-btn').textContent = 'pause';
  setSound(false);
  beginDieout(1100);
});

document.getElementById('sound-btn').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? 'sound on' : 'sound off';
  if (engine && !engine.done) setSound(soundOn);
});

document.getElementById('again-btn').addEventListener('click', () => {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  engine = null;
  setSound(false);
  document.getElementById('pause-btn').textContent = 'pause';
  buildPresets();
  buildDurations();
  showScreen('setup');
});

// ─── SERVICE WORKER ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
